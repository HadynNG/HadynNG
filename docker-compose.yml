###############################################################################
# HadynNG Agentic KYC Platform — Docker Compose
#
# Infrastructure stack:
#   - PostgreSQL  : audit logs, mission records, structured data
#   - Redis       : mission context, caching, pub/sub
#   - MinIO       : document storage (SOP, RAG corpus, audit reports)
#                   also used by Milvus for index/log storage
#   - etcd        : Milvus metadata store
#   - Milvus      : vector DB (agent memory, RAG embeddings)
#   - Ollama      : LLM inference engine
#
# Application services:
#   - mission-broker   : FastAPI gateway (HTTP API)
#   - tools-mcp        : MCP server for external tool integrations
###############################################################################
version: "3.9"

services:
  # ── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: hadynng-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hadynng}
      POSTGRES_USER: ${POSTGRES_USER:-hadynng}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hadynng}"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hadynng-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: hadynng-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hadynng}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme_in_production}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 5

  # ── Milvus dependencies ───────────────────────────────────────────────────

  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: hadynng-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      --advertise-client-urls=http://etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    ports:
      - "2379:2379"
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      retries: 5

  milvus:
    image: milvusdb/milvus:v2.4-latest
    container_name: hadynng-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-hadynng}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-changeme_in_production}
      MINIO_BUCKET_NAME: milvus-storage
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9091/healthz || exit 1"]
      interval: 10s
      retries: 10
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: hadynng-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      retries: 10
      start_period: 30s

  # ── MinIO bucket initialisation ───────────────────────────────────────────

  minio-init:
    image: minio/mc:latest
    container_name: hadynng-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing local/$${MINIO_BUCKET_DOCUMENTS:-documents};
        mc mb --ignore-existing local/$${MINIO_BUCKET_AUDIT:-audit-logs};
        mc mb --ignore-existing local/$${MINIO_BUCKET_TIMELINES:-timelines};
        mc mb --ignore-existing local/milvus-storage;
        echo 'MinIO buckets initialised.';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hadynng}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme_in_production}
      MINIO_BUCKET_DOCUMENTS: ${MINIO_BUCKET_DOCUMENTS:-documents}
      MINIO_BUCKET_AUDIT: ${MINIO_BUCKET_AUDIT:-audit-logs}
      MINIO_BUCKET_TIMELINES: ${MINIO_BUCKET_TIMELINES:-timelines}

  # ── Application Services ──────────────────────────────────────────────────

  mission-broker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hadynng-broker
    restart: unless-stopped
    command: ["python", "-m", "services.mission_broker.app"]
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      milvus:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage:ro

  tools-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hadynng-tools-mcp
    restart: unless-stopped
    command: ["python", "-m", "mcp_servers.tools.server"]
    ports:
      - "8101:8101"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage:ro

volumes:
  postgres_data:
  redis_data:
  minio_data:
  etcd_data:
  milvus_data:
  ollama_data:
